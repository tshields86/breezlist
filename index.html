<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8ff" />
    <meta name="description" content="Easy shared lists for everything" />
    <script>
      // Apply the theme before first paint to avoid a flash. Reads the shared
      // .breezlist.com cookie first (so the preference carries over from the
      // marketing site), then localStorage, then the system preference.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )breezlist-theme=(light|dark|system)/)
          var t = m ? m[1] : localStorage.getItem('breezlist-theme')
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b1220' : '#f4f8ff')
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Breezlist" />
    <title>Breezlist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
